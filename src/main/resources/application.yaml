server:
  port: 8000

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/auth-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/auth-realm/protocol/openid-connect/certs}
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/v1/users/**, /api/v1/cards/**

        - id: auth-service
          uri: http://keycloak:8080
          predicates:
            - Path=/realms/**

        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/v1/orders/**

keycloak:
  url: ${KEYCLOAK_URL:http://keycloak:8080}
  realm: auth-realm
  login-client-id: ${KEYCLOAK_LOGIN_CLIENT_ID:auth-client}
  service-client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:gateway-service}
  service-client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:}

services:
  user-service-url: ${USER_SERVICE_URL:http://user-service:8080}